[project]
name = "teachme-project"
version = "0.1.0"
description = "Revealing LLM Biases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "pydantic>=2.12.5",
    "dvc>=3.66.1",
    "dvc-gdrive>=3.0.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "matplotlib>=3.10.8",
    "emoatlas @ git+https://github.com/MassimoStel/emoatlas.git",
    "torch>=2.11.0",
    "transformers>=5.5.0",
    "seaborn>=0.13.2",
    "marimo>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
